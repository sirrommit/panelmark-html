<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard</title>
    <style>
/* panelmark-html base styles
 *
 * All visual values are controlled by CSS custom properties.
 * Override any variable in your own stylesheet to theme the shell.
 *
 * Custom properties
 * -----------------
 * --pm-border-color        border / divider colour
 * --pm-border-width        thickness of all borders and dividers
 * --pm-gap                 gap between sibling panels (not used by default;
 *                          override to add spacing between panels)
 * --pm-radius              corner radius on panels
 * --pm-heading-font-weight heading font weight
 * --pm-panel-padding       padding inside panel body and heading
 */

:root {
  --pm-border-color: #888;
  --pm-border-width: 1px;
  --pm-gap: 0px;
  --pm-radius: 0px;
  --pm-heading-font-weight: bold;
  --pm-panel-padding: 0.5rem;
}

/* Shell container --------------------------------------------------------- */

.pm-shell {
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: monospace, monospace;
  font-size: 0.875rem;
  border: var(--pm-border-width) solid var(--pm-border-color);
  border-radius: var(--pm-radius);
}

/* Splits ------------------------------------------------------------------ */

.pm-split {
  display: flex;
  flex: 1 1 0;
  min-height: 0;
  min-width: 0;
  gap: var(--pm-gap);
}

.pm-split-h {
  flex-direction: column;
}

.pm-split-v {
  flex-direction: row;
}

/* Single-pixel dividers between sibling panels, without double borders */
.pm-split-h > * + * {
  border-top: var(--pm-border-width) solid var(--pm-border-color);
}

.pm-split-v > * + * {
  border-left: var(--pm-border-width) solid var(--pm-border-color);
}

/* Panels ------------------------------------------------------------------ */

.pm-panel {
  display: flex;
  flex-direction: column;
  flex: 1 1 0;
  min-height: 0;
  min-width: 0;
  box-sizing: border-box;
  overflow: hidden;
}

.pm-panel-heading {
  flex-shrink: 0;
  box-sizing: border-box;
  padding: 0.25rem var(--pm-panel-padding);
  font-weight: var(--pm-heading-font-weight);
  border-bottom: var(--pm-border-width) solid var(--pm-border-color);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pm-panel-body {
  flex: 1 1 0;
  min-height: 0;
  box-sizing: border-box;
  padding: var(--pm-panel-padding);
  overflow: auto;
}

html, body { height: 100%; margin: 0; }
    </style>
</head>
<body>
<div class="pm-shell" data-pm-shell>
  <div class="pm-split pm-split-h">
    <div class="pm-split pm-split-h">
      <div class="pm-split pm-split-v">
        <section class="pm-panel" data-pm-region="nav" data-pm-kind="panel" id="pm-region-nav" data-pm-empty="true">
          <div class="pm-panel-body">
            <p style="margin:0 0 0.5rem;font-weight:bold;color:#555;">Navigation</p>
            <ul style="list-style:none;padding:0;margin:0;line-height:2;">
              <li>▶ Overview</li>
              <li>  Charts</li>
              <li>  Reports</li>
              <li>  Users</li>
              <li>  Settings</li>
            </ul>
          </div>
        </section>
        <section class="pm-panel" data-pm-region="content" data-pm-kind="panel" id="pm-region-content" data-pm-empty="true">
          <div class="pm-panel-body">
            <p style="margin:0 0 0.75rem;font-weight:bold;">Overview</p>
            <table style="width:100%;border-collapse:collapse;font-size:0.8rem;">
              <thead>
                <tr style="border-bottom:1px solid #ccc;">
                  <th style="text-align:left;padding:0.25rem 0.5rem;">Metric</th>
                  <th style="text-align:right;padding:0.25rem 0.5rem;">Today</th>
                  <th style="text-align:right;padding:0.25rem 0.5rem;">7-day avg</th>
                </tr>
              </thead>
              <tbody>
                <tr><td style="padding:0.2rem 0.5rem;">Page views</td><td style="text-align:right;padding:0.2rem 0.5rem;">14,302</td><td style="text-align:right;padding:0.2rem 0.5rem;">11,840</td></tr>
                <tr><td style="padding:0.2rem 0.5rem;">Sessions</td><td style="text-align:right;padding:0.2rem 0.5rem;">3,891</td><td style="text-align:right;padding:0.2rem 0.5rem;">3,210</td></tr>
                <tr><td style="padding:0.2rem 0.5rem;">New users</td><td style="text-align:right;padding:0.2rem 0.5rem;">612</td><td style="text-align:right;padding:0.2rem 0.5rem;">580</td></tr>
                <tr><td style="padding:0.2rem 0.5rem;">Bounce rate</td><td style="text-align:right;padding:0.2rem 0.5rem;">38%</td><td style="text-align:right;padding:0.2rem 0.5rem;">41%</td></tr>
                <tr><td style="padding:0.2rem 0.5rem;">Avg session</td><td style="text-align:right;padding:0.2rem 0.5rem;">2m 14s</td><td style="text-align:right;padding:0.2rem 0.5rem;">1m 58s</td></tr>
              </tbody>
            </table>
          </div>
        </section>
      </div>
      <div class="pm-split pm-split-h">
        <section class="pm-panel" data-pm-region="status" data-pm-kind="panel" id="pm-region-status" data-pm-empty="true">
          <div class="pm-panel-body" style="display:flex;align-items:center;">
            ✔ Data refreshed at 07:38 UTC — 14,302 events loaded — all systems nominal
          </div>
        </section>
      </div>
    </div>
  </div>
</div>
</body>
</html>
